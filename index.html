<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Food Fuel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-light: #FAFAFA;
      --text-dark: #111111;
      --pop-pink: #F72585;
      --pop-blue: #4361EE;
      --pop-teal: #00F5D4;
      --pop-yellow: #FEE440;
      --border-thick: 3px solid var(--text-dark);
      --shadow-hard: 4px 4px 0px var(--text-dark);
      --shadow-sm: 2px 2px 0px var(--text-dark);
    }
    
    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-dark);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: radial-gradient(#d5d5d5 1px, transparent 1px);
      background-size: 20px 20px;
    }

    h1, h2, h3 {
      font-family: 'Outfit', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0;
    }

    /* HEADER */
    header {
      background-color: var(--pop-blue);
      width: 100%;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      border-bottom: var(--border-thick);
      box-sizing: border-box;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      background: var(--pop-yellow);
      border: var(--border-thick);
      box-shadow: var(--shadow-sm);
      border-radius: 6px;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .logo-icon svg { width: 24px; height: 24px; fill: var(--text-dark); }
    header h1 { font-size: 1.8rem; font-weight: 900; text-shadow: 2px 2px 0px var(--text-dark); }

    .header-actions { display: flex; gap: 8px; }

    /* BUTTONS */
    .btn-action, .filter-btn {
      background: white;
      color: var(--text-dark);
      border: var(--border-thick);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
      font-family: 'Space Grotesk', sans-serif;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.1s;
      text-transform: uppercase;
    }

    .btn-action:active, .filter-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--text-dark);
    }
    
    .btn-action svg, .filter-btn svg { width: 14px; height: 14px; fill: var(--text-dark); stroke: var(--text-dark); stroke-width: 0.5;}

    .filter-btn.active { background: var(--pop-teal); }

    /* LAYOUT */
    .container {
      max-width: 1200px;
      width: 95%;
      margin: 20px auto;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
    }

    @media(max-width: 850px) { .container { grid-template-columns: 1fr; } }

    .trendy-card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      border: var(--border-thick);
      box-shadow: var(--shadow-hard);
      margin-bottom: 20px;
    }

    /* TRACKERS */
    .trackers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    @media(max-width: 600px) { .trackers-grid { grid-template-columns: 1fr; } }

    .tracker-box { text-align: center; padding: 15px; border-radius: 8px; border: var(--border-thick); box-shadow: var(--shadow-hard); }
    .calorie-tracker { background-color: var(--pop-yellow); }
    .goodness-tracker { background-color: white; }

    .tracker-box h2 { font-size: 1.2rem; margin-bottom: 5px; }
    
    #total-cals { font-size: 2rem; font-weight: 900; margin: 10px 0; }
    
    #goodness-score-display {
      font-size: 3.5rem; 
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      margin: 5px 0;
      text-shadow: 2px 2px 0px var(--text-dark);
      transition: color 0.3s;
    }
    .goodness-note { font-size: 0.8rem; font-weight: 700; color: #555; margin-top: 5px; }

    .battery-outline {
      border: var(--border-thick); border-radius: 6px; height: 25px; width: 90%;
      margin: 10px auto; position: relative; background: white;
    }
    .battery-fill {
      height: 100%; width: 0%; background: var(--pop-pink);
      transition: width 0.4s, background 0.4s; border-right: var(--border-thick);
    }
    .milestones { display: flex; justify-content: space-between; width: 90%; margin: 0 auto; font-size: 0.7rem; font-weight: 700; }

    /* LIBRARY */
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
    .food-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; max-height: 600px; overflow-y: auto; padding-right: 5px;}

    .food-card {
      background: white; border: var(--border-thick); border-radius: 8px; padding: 10px;
      text-align: center; cursor: pointer; box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column; justify-content: space-between; height: 100%;
    }
    .food-card:hover { background-color: var(--bg-light); transform: translate(-2px, -2px); box-shadow: 4px 4px 0px var(--text-dark); }
    .food-card:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px var(--text-dark); }

    .food-emoji { font-size: 2.2rem; margin-bottom: 5px; }
    .food-name { font-size: 0.85rem; font-weight: 700; margin-bottom: 5px; }
    .food-cal { color: var(--pop-pink); font-weight: 900; font-size: 0.9rem; }
    .food-score-badge { font-size: 0.75rem; background: var(--pop-teal); border: 2px solid var(--text-dark); border-radius: 4px; padding: 2px 5px; font-weight: 700; margin-top: 5px; display: inline-block;}

    /* PLATE SIDEBAR */
    .plate-items { flex-grow: 1; overflow-y: auto; max-height: 400px; margin: 15px 0; }
    .plate-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px; border: var(--border-thick); border-radius: 6px; margin-bottom: 8px; background: var(--bg-light);
    }
    .plate-item-info { flex-grow: 1; margin-left: 8px; line-height: 1.2; }
    .plate-item-info strong { font-size: 0.85rem; }
    
    .qty-controls button {
      background: var(--pop-teal); border: 2px solid var(--text-dark); width: 24px; height: 24px;
      border-radius: 4px; cursor: pointer; font-weight: 900; box-shadow: 2px 2px 0px var(--text-dark);
    }
    .qty-controls button:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px var(--text-dark); }
    .qty-controls span { margin: 0 5px; font-weight: 700; font-size: 0.9rem;}

    .add-custom-btn {
      background: var(--pop-pink); color: white; border: var(--border-thick); padding: 12px;
      border-radius: 6px; font-size: 1rem; cursor: pointer; font-weight: 900; font-family: 'Space Grotesk', sans-serif;
      box-shadow: var(--shadow-hard); width: 100%; text-transform: uppercase;
    }
    .add-custom-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--text-dark); }

    /* MODALS & TOASTS */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content {
      background: white; border: var(--border-thick); box-shadow: var(--shadow-hard);
      padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; text-align: center;
    }
    .modal-content input {
      width: 90%; padding: 10px; margin: 10px 0; border: 2px solid var(--text-dark);
      border-radius: 4px; font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    }
    .modal-btn {
      background: var(--pop-blue); color: white; border: 2px solid var(--text-dark);
      padding: 10px 20px; font-weight: 900; cursor: pointer; border-radius: 4px; box-shadow: var(--shadow-sm); margin-top: 10px;
    }

    .toast-container {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 2000; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
    }
    .toast {
      background: var(--pop-yellow); border: var(--border-thick); box-shadow: var(--shadow-hard);
      padding: 12px 20px; border-radius: 6px; font-weight: 700; color: var(--text-dark);
      animation: slideUp 0.3s ease-out forwards, fadeOut 0.3s ease-in 3.5s forwards; max-width: 300px; text-align: center; font-size: 0.85rem;
    }
    @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

    #confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
  </style>
</head>

    // Audio Context Setup
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      if (type === 'add') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'win') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
        osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); 
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);

    }

    const foodGrid = document.getElementById('food-grid');
    const plateItems = document.getElementById('plate-items');
    const toastContainer = document.getElementById('toast-container');
    
    // Render Library
    function renderFoods(filter = 'all') {
      foodGrid.innerHTML = '';
      const filtered = filter === 'all' ? foodDatabase : foodDatabase.filter(f => f.cat === filter);
      
      filtered.forEach(food => {
        const div = document.createElement('div');
        div.className = 'food-card';
        div.onclick = () => addToPlate(food);
        div.innerHTML = `
          <div class="food-emoji">${food.emoji}</div>
          <div class="food-name">${food.name}</div>
          <div class="food-cal">${food.cal} KCAL</div>
          <div><span class="food-score-badge">${food.score >= 0 ? '+' : ''}${food.score} Score</span></div>
        `;
        foodGrid.appendChild(div);
      });
    }

    // Filter Logic
    document.getElementById('filters').addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.closest('.filter-btn')) {
        const btn = e.target.closest('.filter-btn');
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderFoods(btn.dataset.cat);
      }
    });

    // Plate Logic
    function addToPlate(food) {
      const existing = plate.find(item => item.id === food.id);
      if (existing) { existing.qty++; } 
      else { plate.push({ ...food, qty: 1 }); }
      playSound('add');
      showToast(food.info || `Added ${food.name} to your plate!`);
      updateApp();
    }

    function changeQty(id, delta) {
      const item = plate.find(i => i.id === id);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) plate = plate.filter(i => i.id !== id);
        updateApp();
      }
    }

    // Custom Food Modal Logic
    function openCustomFoodModal() { document.getElementById('custom-food-modal').style.display = 'flex'; }
    function closeModals() { 
      document.getElementById('custom-food-modal').style.display = 'none'; 
      document.getElementById('share-modal').style.display = 'none';
      document.getElementById('log-modal').style.display = 'none';
    }
    
    function saveCustomFood() {
      const name = document.getElementById('custom-name').value;
      const cal = parseInt(document.getElementById('custom-cals').value);
      const score = parseInt(document.getElementById('custom-score').value);
      let emoji = document.getElementById('custom-emoji').value || '🍽️';
      
      if (!name || isNaN(cal) || isNaN(score)) return showToast("Please fill in the name, calories, and score!");
      
      const newFood = { id: 'c' + Date.now(), name, cal, score, cat: 'custom', emoji, info: 'Custom foods are a mystery power!' };
      addToPlate(newFood);
      closeModals();
      document.getElementById('custom-name').value = '';
      document.getElementById('custom-cals').value = '';
      document.getElementById('custom-score').value = '';
      document.getElementById('custom-emoji').value = '';
    }

    // Toast Notification
    function showToast(message) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerText = message;
      toastContainer.appendChild(t);
      setTimeout(() => { if(t.parentElement) t.remove(); }, 4000);
    }

    // Share Modal & Log Modal
    function showShareModal() {
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      document.getElementById('report-day').innerText = days[new Date().getDay()];
      document.getElementById('report-cals').innerText = currentCals + " KCAL";
      document.getElementById('report-score').innerText = currentScore;
      
      const msg = document.getElementById('report-message');
      if (currentScore >= 15) {
        msg.innerText = "You hit your food fuel goodness for your mind and muscles!";
        msg.style.color = "#4CAF50";
      } else {
        msg.innerText = "Keep adding nutritious foods to boost your score!";
        msg.style.color = "#E71D36";
      }
      document.getElementById('share-modal').style.display = 'flex';
    }

    function showLogModal() {
      const list = document.getElementById('log-list');
      if (plate.length === 0) {
        list.innerHTML = "<p>You haven't eaten anything yet today!</p>";
      } else {
        list.innerHTML = plate.map(item => `
          <div style="border-bottom: 2px solid #111; padding: 10px 0;">
            <strong style="font-size:1.1rem;">${item.emoji} ${item.name} (x${item.qty})</strong><br>
            <span style="color:var(--pop-pink); font-weight:bold;">${item.cal * item.qty} kcal</span> | 
            <span style="color:var(--pop-teal); font-weight:bold;">Score: ${(item.score * item.qty)}</span>
          </div>
        `).join('');
      }
      document.getElementById('log-modal').style.display = 'flex';
    }

    function resetDay() {
      plate = [];
      updateApp();
      showToast("Day restarted! Fresh start!");
    }

    // Update UI & Battery
    function updateApp() {
      plateItems.innerHTML = plate.length === 0 
        ? '<p style="text-align:center; font-weight:700; color:#666;">Your plate is empty.</p>' 
        : plate.map(item => `
        <div class="plate-item">
          <div style="font-size: 1.5rem;">${item.emoji}</div>
          <div class="plate-item-info">
            <strong>${item.name}</strong><br>
            <span style="color: var(--pop-pink); font-weight: 900;">${item.cal * item.qty} KCAL</span>
          </div>
          <div class="qty-controls">
            <button onclick="changeQty('${item.id}', -1)">-</button>
            <span>${item.qty}</span>
            <button onclick="changeQty('${item.id}', 1)">+</button>
          </div>
        </div>
      `).join('');

      currentCals = plate.reduce((sum, item) => sum + (item.cal * item.qty), 0);
      currentScore = plate.reduce((sum, item) => sum + (item.score * item.qty), 0);
      
      // Update Cals
      document.getElementById('total-cals').innerHTML = `${currentCals} / ${GOAL} <span style="font-size:1.2rem">KCAL</span>`;
      let pct = Math.min((currentCals / GOAL) * 100, 100);
      const fill = document.getElementById('battery-fill');
      fill.style.width = pct + '%';
      
      if (pct < 33) fill.style.background = 'var(--pop-pink)';
      else if (pct < 66) fill.style.background = 'var(--pop-blue)';
      else fill.style.background = 'var(--pop-teal)';

      // Update Goodness Score Color Grade (Red to Green)
      const scoreDisplay = document.getElementById('goodness-score-display');
      scoreDisplay.innerText = currentScore;
      
      // Calculate Hue: 0 (Red) to 120 (Green) based on approaching score of 30.
      let clampedScore = Math.max(0, Math.min(currentScore, 30));
      let hue = (clampedScore / 30) * 120;
      scoreDisplay.style.color = `hsl(${hue}, 80%, 50%)`;

      const msg = document.getElementById('encouragement');
      if (currentCals === 0) msg.innerText = "LET'S FUEL UP!";
      else if (currentCals < 450) msg.innerText = "NICE START!";
      else if (currentCals < 900) msg.innerText = "KEEP IT GOING!";
      else if (currentCals < 1350) msg.innerText = "HALFWAY THERE!";
      else if (currentCals < 1800) msg.innerText = "ALMOST AT FULL POWER!";
      else if (currentCals >= 1800) {
        msg.innerText = "FULL POWER REACHED!";
        if (currentCals - (plate[plate.length-1].cal) < 1800) triggerWin();
      }
    }

    // Confetti Effect
    function triggerWin() {
      playSound('win');
      const canvas = document.getElementById('confetti');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      const colors = ['#F72585', '#4361EE', '#00F5D4', '#FEE440', '#111111'];
      const particles = [];
      for(let i=0; i<100; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          w: Math.random() * 12 + 6,
          h: Math.random() * 12 + 6,
          dx: Math.random() * 6 - 3,
          dy: Math.random() * 6 + 3,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }

      function animate() {
        ctx.clearRect(0,0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.dx; p.y += p.dy;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.w, p.h);
          ctx.strokeStyle = '#111';
          ctx.lineWidth = 2;
          ctx.strokeRect(p.x, p.y, p.w, p.h);
        });
        requestAnimationFrame(animate);
      }
      animate();
      setTimeout(() => ctx.clearRect(0,0, canvas.width, canvas.height), 3000);
    }

    // Init
    renderFoods('all');
  </script>
